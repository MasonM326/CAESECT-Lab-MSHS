<!DOCTYPE html>
<html>
<head>
    <title>CAESECT MSHS Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="topnav">
        <h1>CAESECT MSHS Dashboard</h1>
    </div>
    <div class="content">
<div class="card-grid">
    <div class="card">
        <p class="card-title">Box Temperature</p>
        <p class="state">T1: <span id="tempValue1"></span> &deg;F</p>
        <p class="state">T2: <span id="tempValue2"></span> &deg;F</p>
        <p class="state">T Avg (T10): <span id="tempValue3"></span> &deg;F</p>
    </div>

    <div class="card">
        <p class="card-title"> Ambient Temperature (T16)</p>
        <p class="state">T: <span id="tempValue4"></span> &deg;F</p>
    </div>

    <div class="card">
        <p class="card-title"> Inlet Pipe</p>
        <p class="state">T: <span id="tempValue5"></span> &deg;F</p>
    </div> <div class="card">
        <p class="card-title"> State of Fan and Heater</p>
        <p class="state">Heater: <span id="heater"></span> </p>
        <p class="state">Fan: <span id="fan"></span> </p>
        <p class="state">Low Speed: <span id="low_speed"></span> </p>
        <p class="state">High Speed: <span id="high_speed"></span> </p>
</div> <div class="card">
        <p class="card-title"> Elapsed Time</p>
        <p class="state">
        Hours: <span id="hrs"></span> 
        Minutes: <span id="mins"></span> 
        Seconds: <span id="secs"></span>
        </p>
        
    </div>
</div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
